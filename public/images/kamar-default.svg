<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Room Graphic -->
  <rect x="100" y="80" width="600" height="340" rx="16" fill="url(#wall)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Window -->
  <rect x="160" y="120" width="180" height="150" rx="8" fill="#93C5FD" stroke="#1E3A8A" stroke-width="4"/>
  <line x1="250" y1="120" x2="250" y2="270" stroke="#1E3A8A" stroke-width="3"/>
  <line x1="160" y1="195" x2="340" y2="195" stroke="#1E3A8A" stroke-width="3"/>
  <!-- Bed -->
  <rect x="420" y="220" width="220" height="150" rx="10" fill="#2563EB"/>
  <rect x="420" y="220" width="220" height="50" rx="6" fill="#1D4ED8"/>
  <rect x="440" y="190" width="80" height="40" rx="8" fill="#FFFFFF"/>
  <rect x="540" y="190" width="80" height="40" rx="8" fill="#FFFFFF"/>
  <!-- Floor line -->
  <line x1="100" y1="370" x2="700" y2="370" stroke="#94A3B8" stroke-width="3"/>
  <!-- Badge label -->
  <rect x="275" y="400" width="250" height="36" rx="18" fill="#1E3A8A"/>
  <text x="400" y="424" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Kost Putri Griya Ayu</text>
</svg>
